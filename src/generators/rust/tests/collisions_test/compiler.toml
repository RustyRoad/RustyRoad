[package]
name = "rustyroad-collision-fixture"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
actix-web = "4"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", features = ["runtime-tokio", "postgres", "macros", "chrono", "json"] }
utoipa = { version = "6", features = ["chrono"] }
